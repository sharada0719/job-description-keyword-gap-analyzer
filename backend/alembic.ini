[alembic]
script_location = alembic
prepend_sys_path = .

# The URL is overridden in env.py from Settings.SYNC_DATABASE_URL.
# This fallback ensures `alembic` CLI works even without a .env file.
sqlalchemy.url = sqlite:///./jobgap.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
